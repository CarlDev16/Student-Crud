spring.application.name=student

# ==========================================
# DATASOURCE — Render PostgreSQL (Production)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SQL INITIALIZATION — Runs before Hibernate validate
# ==========================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SERVER PORT — Render sets the PORT env var
# ==========================================
server.port=${PORT:8080}
