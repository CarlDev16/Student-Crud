services:
  # ── Backend: Spring Boot (Docker) ──────────────────────────────────────────
  - type: web
    name: student-backend
    runtime: docker
    plan: free
    dockerfilePath: ./student/Dockerfile
    dockerContext: ./student
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: student-db
          property: password
      - key: DB_SSL_MODE
        value: require
      - key: PORT
        value: "8080"
      - key: FRONTEND_URL
        sync: false

  # ── Frontend: React Vite (Static Site) ─────────────────────────────────────
  - type: web
    name: student-frontend
    runtime: static
    rootDir: student-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: student-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ── Managed PostgreSQL Database ────────────────────────────────────────────
  - name: student-db
    plan: free
    databaseName: db_student
